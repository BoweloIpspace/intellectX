<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Analytic trigonometry identity map</title><desc id="d">Formula families for reciprocal, quotient, Pythagorean and double-angle identities.</desc><rect width="800" height="420" fill="white"/><g fill="none" stroke="#111" stroke-width="3"><rect x="55" y="55" width="320" height="120" rx="24"/><rect x="425" y="55" width="320" height="120" rx="24"/><rect x="55" y="230" width="320" height="120" rx="24"/><rect x="425" y="230" width="320" height="120" rx="24"/></g><g fill="#111" font-family="Arial,sans-serif" text-anchor="middle"><text x="215" y="92" font-size="22" font-weight="700">QUOTIENT</text><text x="215" y="135" font-size="26">tan θ = sin θ / cos θ</text><text x="585" y="92" font-size="22" font-weight="700">PYTHAGOREAN</text><text x="585" y="135" font-size="24">sin²θ + cos²θ = 1</text><text x="215" y="267" font-size="22" font-weight="700">RECIPROCAL</text><text x="215" y="310" font-size="25">sec θ = 1 / cos θ</text><text x="585" y="267" font-size="22" font-weight="700">DOUBLE ANGLE</text><text x="585" y="310" font-size="24">sin 2θ = 2 sin θ cos θ</text></g></svg>