<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Functions, composition and inverses</title><desc id="d">A monochrome study diagram showing x through g then f, and the inverse relation.</desc><rect width="800" height="420" fill="white"/><g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="70" y="125" width="150" height="90" rx="22"/><rect x="325" y="125" width="150" height="90" rx="22"/><rect x="580" y="125" width="150" height="90" rx="22"/><path d="M220 170h105M475 170h105"/><path d="m304 150 21 20-21 20m255-40 21 20-21 20"/><path d="M620 300H180" stroke-dasharray="13 12"/><path d="m205 280-25 20 25 20"/></g><g fill="#111" font-family="Arial,sans-serif" text-anchor="middle"><text x="145" y="180" font-size="34">x</text><text x="400" y="180" font-size="34">g(x)</text><text x="655" y="180" font-size="34">f(g(x))</text><text x="400" y="95" font-size="30">composition: f ∘ g</text><text x="400" y="350" font-size="27">inverse returns output → input</text></g></svg>