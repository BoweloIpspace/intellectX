<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Trigonometric functions of any angle</title><desc id="d">Unit circle style coordinate diagram with terminal side, radius and quadrant sign summary.</desc><rect width="800" height="420" fill="white"/><g fill="none" stroke="#111" stroke-width="4"><path d="M70 215H450M260 35V395"/><circle cx="260" cy="215" r="145"/><path d="M260 215L365 115" stroke-width="6"/><path d="M365 115V215H260" stroke-dasharray="9 8"/></g><g fill="#111" font-family="Arial,sans-serif"><text x="372" y="108" font-size="22">(x,y)</text><text x="305" y="160" font-size="26">r</text><text x="290" y="205" font-size="24">θ</text><text x="495" y="90" font-size="23">QI: sin + cos + tan +</text><text x="495" y="145" font-size="23">QII: sin + cos − tan −</text><text x="495" y="200" font-size="23">QIII: sin − cos − tan +</text><text x="495" y="255" font-size="23">QIV: sin − cos + tan −</text><text x="495" y="335" font-size="23">sin θ=y/r · cos θ=x/r</text></g></svg>