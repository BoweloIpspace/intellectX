<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Complex numbers and conjugates</title><desc id="d">A monochrome formula diagram for standard form, the imaginary unit and conjugates.</desc><rect width="800" height="420" fill="white"/><g fill="none" stroke="#111" stroke-width="4"><rect x="90" y="80" width="260" height="105" rx="24"/><rect x="450" y="80" width="260" height="105" rx="24"/><path d="M350 132H450"/><path d="m430 112 20 20-20 20"/><rect x="160" y="245" width="480" height="95" rx="24"/></g><g fill="#111" font-family="Arial,sans-serif" text-anchor="middle"><text x="220" y="125" font-size="30">z = a + bi</text><text x="220" y="158" font-size="23">i² = −1</text><text x="580" y="125" font-size="30">z̄ = a − bi</text><text x="580" y="158" font-size="23">conjugate</text><text x="400" y="292" font-size="28">z z̄ = a² + b²</text><text x="400" y="325" font-size="22">use the conjugate to divide complex numbers</text></g></svg>