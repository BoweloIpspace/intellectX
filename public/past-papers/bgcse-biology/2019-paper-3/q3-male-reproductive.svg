<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Reconstructed male reproductive system study diagram</title>
  <desc id="desc">A side-view study diagram. S points to the narrow sperm-carrying tube running upward from a testis. T points to a gland behind the bladder, U to the gland below the bladder, and V to the oval organ inside the scrotum.</desc>
