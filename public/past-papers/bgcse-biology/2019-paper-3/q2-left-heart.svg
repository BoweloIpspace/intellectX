  <g fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M315 66 C250 70 220 112 229 169 C235 204 266 219 300 221"/>
    <path d="M300 221 C241 240 230 309 270 352 C309 394 409 380 452 314 C480 270 469 209 428 177"/>
    <path d="M428 177 C455 126 447 85 414 60"/>
    <path d="M414 60 C421 34 454 25 482 42 C511 60 514 97 497 128"/>
    <path d="M300 221 L354 249 L410 211"/>
    <path d="M354 249 L354 326" stroke-width="3"/>
    <path d="M285 222 C308 237 331 239 354 226" stroke-width="3"/>
    <path d="M354 226 C377 239 400 236 423 219" stroke-width="3"/>
    <path d="M550 206 L407 226"/>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif">
