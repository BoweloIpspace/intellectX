<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Adrenaline level after a fright</title>
  <desc id="desc">A qualitative graph from 0 to 20 minutes. Adrenaline rises rapidly after the fright, reaches a peak before 10 minutes, and then falls through 15 and 20 minutes.</desc>
  <rect width="760" height="430" fill="white"/>
  <g stroke="#111827" fill="none" stroke-linecap="round">
    <path d="M108 340 L660 340" stroke-width="4"/>
    <path d="M108 340 L108 68" stroke-width="4"/>
    <path d="M108 314 C156 279 185 183 248 127 C292 87 342 95 385 128 C442 173 473 227 520 260 C565 291 607 302 660 310" stroke-width="6"/>
    <g stroke-width="2">
      <path d="M108 340 L108 351"/><path d="M246 340 L246 351"/><path d="M384 340 L384 351"/><path d="M522 340 L522 351"/><path d="M660 340 L660 351"/>
      <path d="M522 68 L522 340" stroke-dasharray="8 8"/>
    </g>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="22">
    <text x="100" y="378">0</text><text x="238" y="378">5</text><text x="374" y="378">10</text><text x="510" y="378">15</text><text x="648" y="378">20</text>
    <text x="318" y="410">time / minutes</text>
    <text x="24" y="72">adrenaline</text><text x="24" y="100">level</text>
    <text x="532" y="92" font-size="18">15 min</text>
  </g>
</svg>
