<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Reconstructed fungus diagram</title>
  <desc id="desc">A branching fungal hypha with a rounded cell. Q points to the nucleus and R points to the outer cell wall. A food granule is shown inside the cell.</desc>
  <rect width="720" height="360" fill="white"/>
  <g fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 270 C180 230 220 210 275 208 C328 205 365 226 418 218 C468 211 500 178 548 150"/>
    <path d="M272 208 C255 165 260 125 292 84"/>
    <path d="M414 218 C431 260 470 284 522 292"/>
    <ellipse cx="352" cy="211" rx="86" ry="58"/>
    <ellipse cx="352" cy="211" rx="70" ry="45" stroke-width="2.5"/>
    <circle cx="330" cy="204" r="18"/>
    <circle cx="385" cy="224" r="9" fill="#111827"/>
    <path d="M160 86 L300 184"/>
    <path d="M572 88 L433 184"/>
    <path d="M555 280 L401 231" stroke-width="2.5"/>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700">
    <text x="118" y="78">Q</text>
    <text x="580" y="82">R</text>
  </g>
  <text x="558" y="303" fill="#111827" font-family="Arial, sans-serif" font-size="22">food granule</text>
</svg>
