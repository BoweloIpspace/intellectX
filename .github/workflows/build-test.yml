name: Build and test

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browsers
        run: npm exec -- playwright install --with-deps chromium firefox webkit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint with zero-warning budget
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Build explicit E2E fixture app
        run: |
          rm -rf .next
          NEXT_PUBLIC_E2E_CATALOG_FIXTURES=1 npm run build

      - name: E2E tests against production server
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SERVER_MODE: production
