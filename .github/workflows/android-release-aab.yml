name: Android release AAB (unsigned)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-release-aab.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/check-android-manifest.mjs"
      - "src/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-release-aab.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/check-android-manifest.mjs"
      - "src/**"

permissions:
  contents: read

jobs:
  build-release-aab:
    runs-on: ubuntu-latest

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      INTELLECTX_VERSION_CODE: ${{ github.run_number }}
      INTELLECTX_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify signed release fails closed without credentials
        working-directory: android
        shell: bash
        env:
          INTELLECTX_REQUIRE_RELEASE_SIGNING: "true"
        run: |
          chmod +x gradlew
          set +e
          SIGNING_CHECK_OUTPUT="$(./gradlew --no-daemon --console=plain help 2>&1)"
          SIGNING_CHECK_STATUS=$?
          set -e

          if [ "$SIGNING_CHECK_STATUS" -eq 0 ]; then
            echo "Expected required release signing to fail without upload-key credentials." >&2
            exit 1
          fi

          if ! grep -Fq "Signed Android release required, but upload-key credentials are not fully configured." <<<"$SIGNING_CHECK_OUTPUT"; then
            echo "Release signing guard failed for an unexpected reason." >&2
            exit 1
          fi

      - name: Build unsigned release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain bundleRelease

      - name: Verify merged Android manifest policy
        shell: bash
        run: |
          set -euo pipefail
          MERGED_MANIFEST=""
          while IFS= read -r candidate; do
            case "$candidate" in
              *merged_manifest*|*merged_manifests*|*packaged_manifests*)
                MERGED_MANIFEST="$candidate"
                break
                ;;
            esac
          done < <(find android/app/build/intermediates -type f -name AndroidManifest.xml -path '*release*' | sort)
          test -n "$MERGED_MANIFEST"
          node scripts/check-android-manifest.mjs "$MERGED_MANIFEST"

      - name: Verify release AAB
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          unzip -t "$AAB" >/dev/null
          ls -lh "$AAB"
          sha256sum "$AAB" | tee "$AAB.sha256"

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intellectx-release-aab-unsigned
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
