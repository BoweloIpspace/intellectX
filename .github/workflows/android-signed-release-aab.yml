name: Android signed release AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Android versionCode
        required: true
        type: string
      version_name:
        description: Human-readable Android versionName
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-signed-release-aab:
    runs-on: ubuntu-latest

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      INTELLECTX_REQUIRE_RELEASE_SIGNING: "true"
      INTELLECTX_VERSION_CODE: ${{ inputs.version_code }}
      INTELLECTX_VERSION_NAME: ${{ inputs.version_name }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2
        with:
          egress-policy: audit

      - name: Checkout exact release ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate release inputs and materialize upload keystore
        shell: bash
        env:
          INTELLECTX_UPLOAD_KEYSTORE_BASE64: ${{ secrets.INTELLECTX_UPLOAD_KEYSTORE_BASE64 }}
          INTELLECTX_UPLOAD_STORE_PASSWORD: ${{ secrets.INTELLECTX_UPLOAD_STORE_PASSWORD }}
          INTELLECTX_UPLOAD_KEY_ALIAS: ${{ secrets.INTELLECTX_UPLOAD_KEY_ALIAS }}
          INTELLECTX_UPLOAD_KEY_PASSWORD: ${{ secrets.INTELLECTX_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! "$INTELLECTX_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || [ "$INTELLECTX_VERSION_CODE" -gt 2100000000 ]; then
            echo "version_code must be an integer from 1 through 2100000000." >&2
            exit 1
          fi

          if [ -z "$INTELLECTX_VERSION_NAME" ] || [ "${#INTELLECTX_VERSION_NAME}" -gt 100 ]; then
            echo "version_name must be non-empty and no longer than 100 characters." >&2
            exit 1
          fi

          for secret_name in INTELLECTX_UPLOAD_KEYSTORE_BASE64 INTELLECTX_UPLOAD_STORE_PASSWORD INTELLECTX_UPLOAD_KEY_ALIAS INTELLECTX_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Required Android signing secret is not configured: $secret_name" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/intellectx-upload.jks"
          printf '%s' "$INTELLECTX_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "INTELLECTX_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env INTELLECTX_UPLOAD_STORE_PASSWORD \
            -alias "$INTELLECTX_UPLOAD_KEY_ALIAS" \
            >/dev/null

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed release AAB
        working-directory: android
        env:
          INTELLECTX_UPLOAD_STORE_PASSWORD: ${{ secrets.INTELLECTX_UPLOAD_STORE_PASSWORD }}
          INTELLECTX_UPLOAD_KEY_ALIAS: ${{ secrets.INTELLECTX_UPLOAD_KEY_ALIAS }}
          INTELLECTX_UPLOAD_KEY_PASSWORD: ${{ secrets.INTELLECTX_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain bundleRelease

      - name: Verify merged Android manifest policy
        shell: bash
        run: |
          set -euo pipefail
          MERGED_MANIFEST=""
          while IFS= read -r candidate; do
            case "$candidate" in
              *merged_manifest*|*merged_manifests*|*packaged_manifests*)
                MERGED_MANIFEST="$candidate"
                break
                ;;
            esac
          done < <(find android/app/build/intermediates -type f -name AndroidManifest.xml -path '*release*' | sort)
          test -n "$MERGED_MANIFEST"
          node scripts/check-android-manifest.mjs "$MERGED_MANIFEST"

      - name: Verify signed AAB and checksum
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          ENTRY_LIST="$RUNNER_TEMP/intellectx-aab-entries.txt"
          test -f "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -Z1 "$AAB" > "$ENTRY_LIST"
          grep -Eq '^META-INF/[^/]+\.SF$' "$ENTRY_LIST"
          jarsigner -verify -strict "$AAB" >/dev/null
          sha256sum "$AAB" | tee "$AAB.sha256"

      - name: Upload signed release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intellectx-release-aab-signed-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/intellectx-upload.jks"
          rm -f "$RUNNER_TEMP/intellectx-aab-entries.txt"
