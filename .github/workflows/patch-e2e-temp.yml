name: Temporary E2E patch

on:
  push:
    branches:
      - release/production-hardening-no-secrets
    paths:
      - ".github/workflows/patch-e2e-temp.yml"

permissions:
  contents: write

jobs:
  patch-smoke-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/production-hardening-no-secrets
      - name: Replace obsolete native-event test helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tests/e2e/smoke.spec.ts")
          source = path.read_text(encoding="utf-8-sig")

          source, count = re.subn(
              r'async function fillInputWithNativeEvent\(.*?\n}\n\n(?=async function visibleNav)',
              '',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Expected to remove one obsolete helper, removed {count}")

          replacements = {
              '''  await fillInputWithNativeEvent(page, 'input[name="email"]', "nav.learner@intellectx.local");\n  await fillInputWithNativeEvent(page, 'input[name="password"]', "anything");''':
              '''  await page.getByLabel("Email").fill("nav.learner@intellectx.local");\n  await page.getByLabel("Password").fill("anything");''',
              '''  await fillInputWithNativeEvent(page, 'input[name="email"]', "returning.learner@intellectx.local");\n  await fillInputWithNativeEvent(page, 'input[name="password"]', "anything");''':
              '''  await page.getByLabel("Email").fill("returning.learner@intellectx.local");\n  await page.getByLabel("Password").fill("anything");''',
          }

          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one matching login helper block: {old!r}")
              source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")
          PY
      - name: Commit test cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/smoke.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: use normal input filling for web login smoke tests"
          git push origin HEAD:release/production-hardening-no-secrets
