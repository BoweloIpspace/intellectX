name: Android lifecycle instrumentation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-lifecycle.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "convex/schema.ts"
      - "convex/pastPapers.ts"
      - "convex/adminPastPapers.ts"
      - "convex/seedBiologyPastPaper*.ts"
      - "src/app/mobile-*/**"
      - "src/app/quiz/**"
      - "src/components/education/mobile-*.tsx"
      - "src/components/education/quiz-page-content.tsx"
      - "src/components/education/secure-quiz-player.tsx"
      - "src/lib/mobile-*.ts"
      - "src/lib/local-learner-profile-data.ts"
      - "src/lib/feature-scope.ts"

permissions:
  contents: read

jobs:
  android-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      INTELLECTX_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d6b328d5b50c63a1b4fc0cc3c94
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@7a445ee88d4e23b52c33f7a27e44c9b0c02fe04b
        with:
          distribution: temurin
          java-version: "21"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Android SDK and emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Create Android virtual device
        run: |
          echo no | avdmanager create avd \
            --force \
            --name intellectx-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

      - name: Boot Android emulator
        run: |
          nohup emulator -avd intellectx-ci -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 5; done'
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run Android instrumentation tests
        working-directory: android
        run: ./gradlew connectedDebugAndroidTest -PversionName="$INTELLECTX_VERSION_NAME" -PversionCode="${{ github.run_number }}"

      - name: Verify cold process restart
        run: |
          adb shell am force-stop com.intellectx.app
          adb shell monkey -p com.intellectx.app -c android.intent.category.LAUNCHER 1
          sleep 5
          adb shell pidof com.intellectx.app

      - name: Verify production WebView renders
        run: |
          timeout 120 bash -c '
            while true; do
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/window.xml "$RUNNER_TEMP/window.xml" >/dev/null 2>&1 || true
              if grep -Eq "Study smarter|Choose your courses|Continue learning|IntellectX|Quiz" "$RUNNER_TEMP/window.xml"; then
                exit 0
              fi
              sleep 5
            done
          '

      - name: Exercise Android Back and relaunch
        run: |
          adb shell input keyevent 4
          sleep 2
          adb shell monkey -p com.intellectx.app -c android.intent.category.LAUNCHER 1
          sleep 4
          adb shell pidof com.intellectx.app

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: android-lifecycle-reports
          path: |
            android/app/build/reports/androidTests/
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/window.xml
          if-no-files-found: warn
