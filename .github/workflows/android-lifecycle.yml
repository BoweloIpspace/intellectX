name: Android lifecycle instrumentation

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-lifecycle.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "convex/schema.ts"
      - "convex/pastPapers.ts"
      - "convex/adminPastPapers.ts"
      - "convex/seedBiologyPastPaper*.ts"
      - "public/mobile-error.html"
      - "scripts/check-android-manifest.mjs"
      - "src/app/mobile-*/**"
      - "src/app/quiz/**"
      - "src/components/education/mobile-*.tsx"
      - "src/components/education/quiz-page-content.tsx"
      - "src/components/education/secure-quiz-player.tsx"
      - "src/lib/mobile-*.ts"
      - "src/lib/local-learner-profile-data.ts"
      - "src/lib/feature-scope.ts"

permissions:
  contents: read

jobs:
  android-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      INTELLECTX_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Android SDK and emulator image
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)"
            AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          fi
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Create Android virtual device
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/intellectx-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$AVDMANAGER" create avd \
            --force \
            --name intellectx-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6
          test -f "$ANDROID_AVD_HOME/intellectx-ci.ini"
          ls -la "$ANDROID_AVD_HOME"

      - name: Boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          EMULATOR_LOG="$RUNNER_TEMP/intellectx-emulator.log"
          test -x "$EMULATOR"
          "$EMULATOR" -list-avds | grep -qx "intellectx-ci"
          nohup "$EMULATOR" \
            -avd intellectx-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -accel on \
            -gpu swiftshader_indirect \
            > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!

          sleep 5
          if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
            echo "Android emulator exited before registering with adb."
            cat "$EMULATOR_LOG"
            exit 1
          fi

          if ! timeout 120 adb wait-for-device; then
            echo "Android emulator did not register with adb within 120 seconds."
            adb devices || true
            cat "$EMULATOR_LOG"
            exit 1
          fi

          if ! timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            echo "Android emulator registered but did not finish booting within 240 seconds."
            adb devices || true
            cat "$EMULATOR_LOG"
            exit 1
          fi

          adb shell input keyevent 82
          adb devices

      - name: Run Android instrumentation tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest

      - name: Verify merged Android manifest policy
        shell: bash
        run: |
          set -euo pipefail
          MERGED_MANIFEST=""
          while IFS= read -r candidate; do
            case "$candidate" in
              *merged_manifest*|*merged_manifests*|*packaged_manifests*)
                MERGED_MANIFEST="$candidate"
                break
                ;;
            esac
          done < <(find android/app/build/intermediates -type f -name AndroidManifest.xml -path '*debug*' | sort)
          test -n "$MERGED_MANIFEST"
          node scripts/check-android-manifest.mjs "$MERGED_MANIFEST"

      - name: Verify cold process restart
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          adb install -r "$APK"
          adb shell pm list packages | grep -q '^package:com.intellectx.app$'
          adb shell am force-stop com.intellectx.app
          START_OUTPUT="$(adb shell am start -W -n com.intellectx.app/.MainActivity)"
          printf '%s\n' "$START_OUTPUT"
          printf '%s\n' "$START_OUTPUT" | grep -q "Status: ok"
          adb shell dumpsys activity activities | grep -q "com.intellectx.app"

      - name: Verify production WebView renders
        shell: bash
        run: |
          set -euo pipefail
          UI_DUMP="$RUNNER_TEMP/intellectx-window.xml"
          rendered=false

          for attempt in $(seq 1 30); do
            adb shell uiautomator dump /sdcard/intellectx-window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/intellectx-window.xml > "$UI_DUMP" 2>/dev/null || true

            if grep -Eq "IntellectX (isn't responding|keeps stopping)" "$UI_DUMP"; then
              echo "IntellectX exposed an Android crash/ANR dialog during WebView verification."
              cat "$UI_DUMP" || true
              adb logcat -d | tail -n 300 || true
              exit 1
            fi

            if grep -Eq "Pixel Launcher (isn't responding|keeps stopping)" "$UI_DUMP"; then
              echo "Pixel Launcher ANR obscured IntellectX; dismissing only the launcher failure and restoring the app."
              adb shell am force-stop com.google.android.apps.nexuslauncher || true
              adb shell input keyevent 4 || true
              adb shell am start -n com.intellectx.app/.MainActivity >/dev/null || true
              sleep 2
              continue
            fi

            if grep -Eq 'Continue on this device|Create a local learner profile|Choose your courses|Your courses|IntellectX' "$UI_DUMP"; then
              rendered=true
              break
            fi

            sleep 2
          done

          if [ "$rendered" != "true" ]; then
            echo "The production remote WebView did not expose an IntellectX screen within the verification retry window."
            cat "$UI_DUMP" || true
            adb logcat -d | tail -n 300 || true
            exit 1
          fi

          echo "Production IntellectX WebView rendered successfully."

      - name: Verify offline fallback and network recovery
        shell: bash
        run: |
          set -euo pipefail
          OFFLINE_DUMP="$RUNNER_TEMP/intellectx-offline-window.xml"
          RECOVERY_DUMP="$RUNNER_TEMP/intellectx-recovery-window.xml"

          restore_network() {
            adb shell cmd connectivity airplane-mode disable >/dev/null 2>&1 || true
          }
          trap restore_network EXIT

          adb shell am force-stop com.intellectx.app
          adb shell pm clear com.intellectx.app | grep -q 'Success'
          adb shell cmd connectivity airplane-mode enable

          for attempt in $(seq 1 15); do
            if [ "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 1
          done
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"

          OFFLINE_START="$(adb shell am start -W -n com.intellectx.app/.MainActivity)"
          printf '%s\n' "$OFFLINE_START"
          printf '%s\n' "$OFFLINE_START" | grep -q "Status: ok"

          offline_fallback=false
          for attempt in $(seq 1 30); do
            adb shell uiautomator dump /sdcard/intellectx-offline-window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/intellectx-offline-window.xml > "$OFFLINE_DUMP" 2>/dev/null || true

            if grep -Eq "IntellectX (isn't responding|keeps stopping)" "$OFFLINE_DUMP"; then
              echo "IntellectX crashed or ANR'd while offline."
              cat "$OFFLINE_DUMP" || true
              exit 1
            fi

            if grep -Fq 'IntellectX is temporarily unavailable' "$OFFLINE_DUMP" && grep -Fq 'text="Try again"' "$OFFLINE_DUMP"; then
              offline_fallback=true
              break
            fi
            sleep 2
          done

          if [ "$offline_fallback" != "true" ]; then
            echo "The packaged Capacitor offline fallback did not render with its retry control."
            cat "$OFFLINE_DUMP" || true
            adb logcat -d | tail -n 300 || true
            exit 1
          fi

          adb shell cmd connectivity airplane-mode disable
          for attempt in $(seq 1 15); do
            if [ "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "0" ]; then
              break
            fi
            sleep 1
          done
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "0"

          network_ready=false
          for attempt in $(seq 1 30); do
            if adb shell dumpsys connectivity | grep -q 'VALIDATED'; then
              network_ready=true
              break
            fi
            sleep 2
          done
          if [ "$network_ready" != "true" ]; then
            echo "Android connectivity did not become validated after airplane mode was disabled."
            adb shell dumpsys connectivity || true
            exit 1
          fi

          RETRY_BOUNDS="$(sed -n 's/.*text="Try again"[^>]*bounds="\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]".*/\1 \2 \3 \4/p' "$OFFLINE_DUMP")"
          read -r RETRY_LEFT RETRY_TOP RETRY_RIGHT RETRY_BOTTOM <<< "$RETRY_BOUNDS"
          test -n "$RETRY_LEFT"
          test -n "$RETRY_TOP"
          test -n "$RETRY_RIGHT"
          test -n "$RETRY_BOTTOM"
          RETRY_X=$(( (RETRY_LEFT + RETRY_RIGHT) / 2 ))
          RETRY_Y=$(( (RETRY_TOP + RETRY_BOTTOM) / 2 ))
          adb shell input tap "$RETRY_X" "$RETRY_Y"

          recovered=false
          for attempt in $(seq 1 45); do
            adb shell uiautomator dump /sdcard/intellectx-recovery-window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/intellectx-recovery-window.xml > "$RECOVERY_DUMP" 2>/dev/null || true

            if grep -Eq "IntellectX (isn't responding|keeps stopping)" "$RECOVERY_DUMP"; then
              echo "IntellectX crashed or ANR'd during network recovery."
              cat "$RECOVERY_DUMP" || true
              exit 1
            fi

            if grep -Eq 'Continue on this device|Create a local learner profile|Choose your courses|Your courses' "$RECOVERY_DUMP"; then
              recovered=true
              break
            fi
            sleep 2
          done

          if [ "$recovered" != "true" ]; then
            echo "IntellectX did not recover after connectivity returned and the user retry control was activated."
            cat "$RECOVERY_DUMP" || true
            adb logcat -d | tail -n 300 || true
            exit 1
          fi

          trap - EXIT
          echo "Offline fallback and user-triggered network recovery verified."

      - name: Exercise Android Back and relaunch
        shell: bash
        run: |
          adb shell input keyevent 4
          sleep 1
          RELAUNCH_OUTPUT="$(adb shell am start -W -n com.intellectx.app/.MainActivity)"
          printf '%s\n' "$RELAUNCH_OUTPUT"
          printf '%s\n' "$RELAUNCH_OUTPUT" | grep -q "Status: ok"

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-lifecycle-test-reports
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/intellectx-emulator.log
            ${{ runner.temp }}/intellectx-window.xml
            ${{ runner.temp }}/intellectx-offline-window.xml
            ${{ runner.temp }}/intellectx-recovery-window.xml
          if-no-files-found: warn
          retention-days: 14
