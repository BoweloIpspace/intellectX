name: Android debug APK

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/check-android-manifest.mjs"
      - "src/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/check-android-manifest.mjs"
      - "src/**"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      INTELLECTX_VERSION_CODE: ${{ github.run_number }}
      INTELLECTX_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug

      - name: Verify merged Android manifest policy
        shell: bash
        run: |
          set -euo pipefail
          MERGED_MANIFEST=""
          while IFS= read -r candidate; do
            case "$candidate" in
              *merged_manifest*|*merged_manifests*|*packaged_manifests*)
                MERGED_MANIFEST="$candidate"
                break
                ;;
            esac
          done < <(find android/app/build/intermediates -type f -name AndroidManifest.xml -path '*debug*' | sort)
          test -n "$MERGED_MANIFEST"
          node scripts/check-android-manifest.mjs "$MERGED_MANIFEST"

      - name: Verify APK
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intellectx-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
