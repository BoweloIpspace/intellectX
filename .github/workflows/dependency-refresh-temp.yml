name: Temporary dependency refresh

on:
  push:
    branches:
      - release/production-hardening-no-secrets
    paths:
      - ".github/workflows/dependency-refresh-temp.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/production-hardening-no-secrets
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
      - name: Refresh patched framework dependencies
        run: |
          npm install --save-exact next@16.3.1 react@19.2.8 react-dom@19.2.8
          npm install --save-dev --save-exact eslint-config-next@16.3.1
          npm audit fix --package-lock-only
          npm ci
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from "eslint/config";
          import nextVitals from "eslint-config-next/core-web-vitals";
          import nextTs from "eslint-config-next/typescript";

          export default defineConfig([
            ...nextVitals,
            ...nextTs,
            {
              rules: {
                "@next/next/no-img-element": "off",
                "@typescript-eslint/no-explicit-any": "off",
                "react-hooks/set-state-in-effect": "off",
              },
            },
            globalIgnores([".next/**", "out/**", "build/**", "next-env.d.ts", "convex/_generated/**"]),
          ]);
          EOF
      - name: Verify migration
        run: |
          npm run typecheck
          npx eslint .
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json eslint.config.mjs
          git diff --cached --quiet && exit 0
          git commit -m "chore: upgrade patched framework dependencies"
          git push origin HEAD:release/production-hardening-no-secrets
